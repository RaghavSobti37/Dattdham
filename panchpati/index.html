<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#a71922">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <title>श्री दत्त पंचपदी | Shri Kshetra Dattadham</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@500&family=Source+Sans+3:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,500&display=swap');
    :root{--maroon:#a71922;--ink:#282015;--stone:#675445;--sand:#fff7e5;--linen:#f1e3c2;--line:#e7c878;--white:#fffdf5;--page-shadow:#28201526;--serif:"Source Serif 4","Noto Serif Devanagari",serif;--sans:"Source Sans 3","Noto Serif Devanagari",sans-serif}
    *{box-sizing:border-box}
    html,body{overflow-x:clip}
    body{margin:0;background:var(--linen);color:var(--ink);font:400 16px/1.5 var(--sans)}
    .bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;min-height:60px;padding:8px max(16px,calc((100% - 1000px)/2));background:var(--white);border-bottom:1px solid var(--line)}
    .home{display:block;flex:0 0 auto;border-radius:50%}
    .bar img{display:block;width:36px;height:36px;border-radius:50%}
    .bar h1{margin:0;min-width:0;color:var(--maroon);font:500 18px/1.15 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bar small{display:block;color:var(--stone);font:400 12px/1.3 var(--sans);overflow:hidden;text-overflow:ellipsis}
    .count{margin:0 0 0 auto;color:var(--stone);font:600 13px var(--sans);white-space:nowrap}
    .actions{display:flex;align-items:center;gap:12px;flex:0 0 auto}
    .site-link{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;background:var(--maroon);border:1px solid var(--maroon);color:var(--white);font:600 13px/1 var(--sans);text-decoration:none;white-space:nowrap;transition:background .2s,color .2s}
    .site-link:hover{background:transparent;color:var(--maroon)}
    .lang-switch{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--sand)}
    .lang-switch button{min-height:34px;padding:0 13px;border:0;border-radius:999px;background:transparent;color:var(--stone);font:600 13px/1 var(--sans);cursor:pointer;white-space:nowrap}
    .lang-switch button[lang="hi"]{font-family:"Noto Serif Devanagari",var(--sans);font-size:14px}
    .lang-switch button[aria-pressed="true"]{background:var(--maroon);color:var(--white)}
    .lang-switch button:not([aria-pressed="true"]):hover{color:var(--maroon)}
    button:focus-visible{outline:3px solid var(--maroon);outline-offset:3px}
    @media(max-width:640px){
      .bar{flex-wrap:wrap;gap:8px 10px;padding:8px 16px 10px}
      .bar img{width:32px;height:32px}
      .bar h1{flex:1 1 0;font-size:16px}
      .bar small{font-size:11px}
      .count{font-size:12px}
      .actions{flex:1 0 100%;justify-content:space-between;gap:10px}
      .site-link{flex:1 1 auto;max-width:220px}
    }
    @media(max-width:360px){.bar{padding-inline:12px}.lang-switch button{padding:0 10px}.site-link{padding:0 10px;font-size:12px}}
    .pages{display:grid;gap:18px;width:min(1000px,100%);margin:0 auto;padding:18px 16px 48px}
    .page{position:relative;margin:0;background:var(--white);box-shadow:0 2px 14px var(--page-shadow)}
    .page canvas{display:block;width:100%;height:auto}
    .status{padding:48px 16px;text-align:center;color:var(--stone)}
    .status a{color:var(--maroon)}
    a:focus-visible{outline:3px solid var(--maroon);outline-offset:3px}
  </style>
</head>
<body>
  <header class="bar">
    <a class="home" href="/"><img src="/assets/dattadham-seal.jpg" alt="Shri Kshetra Dattadham home" data-home-alt></a>
    <h1><span data-i18n data-en="Shri Datta Panchpadi" data-hi="श्री दत्त पंचपदी">Shri Datta Panchpadi</span><small data-i18n data-en="Shri Kshetra Dattadham" data-hi="श्री क्षेत्र दत्ताधाम">Shri Kshetra Dattadham</small></h1>
    <p class="count" aria-live="polite" data-count></p>
    <div class="actions">
      <div class="lang-switch" role="group" aria-label="Language / भाषा">
        <button type="button" lang="en" aria-pressed="true" data-set-language="en">English</button>
        <button type="button" lang="hi" aria-pressed="false" data-set-language="hi">हिंदी</button>
      </div>
      <a class="site-link" href="/" data-home-link><span data-i18n data-en="Main website" data-hi="मुख्य वेबसाइट">Main website</span><span aria-hidden="true">→</span></a>
    </div>
  </header>
  <main class="pages" data-pages aria-label="Document pages">
    <p class="status" data-status><span data-i18n data-en="Loading the document…" data-hi="दस्तावेज़ लोड हो रहा है…">Loading the document…</span> <noscript>This viewer needs JavaScript. <a href="/panchpati/panchpati.pdf">Open the document</a>.</noscript></p>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    const languageButtons = document.querySelectorAll('[data-set-language]');
    const homeLinks = document.querySelectorAll('.home, [data-home-link]');
    const homeImage = document.querySelector('[data-home-alt]');
    let pageCount = 0;
    const copy = {
      en: {
        title: 'Shri Datta Panchpadi | Shri Kshetra Dattadham',
        pages: (n) => `${n} pages`,
        page: (n, total) => `Page ${n} of ${total}`,
        error: 'The document could not be shown here. <a href="/panchpati/panchpati.pdf">Open the document</a>.',
        home: 'Shri Kshetra Dattadham home',
      },
      hi: {
        title: 'श्री दत्त पंचपदी | श्री क्षेत्र दत्ताधाम',
        pages: (n) => `${n} पृष्ठ`,
        page: (n, total) => `पृष्ठ ${n} / ${total}`,
        error: 'दस्तावेज़ यहाँ नहीं दिख सका। <a href="/panchpati/panchpati.pdf">दस्तावेज़ खोलें</a>।',
        home: 'श्री क्षेत्र दत्ताधाम मुखपृष्ठ',
      },
    };
    const lang = () => (document.documentElement.lang === 'hi' ? 'hi' : 'en');

    function applyLanguage(language) {
      document.documentElement.lang = language;
      document.querySelectorAll('[data-i18n]').forEach((node) => { node.textContent = node.dataset[language]; });
      languageButtons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.setLanguage === language)));
      // Carry the language to the home page in the link too, so it works even where storage is blocked.
      homeLinks.forEach((link) => { link.href = language === 'hi' ? '/?lang=hi' : '/?lang=en'; });
      homeImage.alt = copy[language].home;
      document.title = copy[language].title;
      if (pageCount) document.querySelector('[data-count]').textContent = copy[language].pages(pageCount);
      document.querySelectorAll('canvas[data-page-number]').forEach((canvas) => {
        canvas.setAttribute('aria-label', copy[language].page(canvas.dataset.pageNumber, pageCount));
      });
      try { localStorage.setItem('dattadham-language', language); } catch {}
    }

    let savedLanguage = new URLSearchParams(location.search).get('lang');
    if (savedLanguage !== 'hi' && savedLanguage !== 'en') {
      savedLanguage = 'en';
      try { savedLanguage = localStorage.getItem('dattadham-language') === 'hi' ? 'hi' : 'en'; } catch {}
    }
    applyLanguage(savedLanguage);
    languageButtons.forEach((button) => button.addEventListener('click', () => applyLanguage(button.dataset.setLanguage)));


    const PDF_URL = '/panchpati/panchpati.pdf';
    const pagesEl = document.querySelector('[data-pages]');
    const statusEl = document.querySelector('[data-status]');
    const countEl = document.querySelector('[data-count]');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    pdfjsLib.getDocument(PDF_URL).promise.then(async (pdf) => {
      statusEl.remove();
      pageCount = pdf.numPages;
      countEl.textContent = copy[lang()].pages(pageCount);
      const first = await pdf.getPage(1);
      const base = first.getViewport({ scale: 1 });
      const rendered = new Set();

      async function render(figure) {
        const number = Number(figure.dataset.page);
        if (rendered.has(number)) return;
        rendered.add(number);
        const page = await pdf.getPage(number);
        const cssWidth = figure.clientWidth;
        const unscaled = page.getViewport({ scale: 1 });
        const scale = (cssWidth / unscaled.width) * Math.min(window.devicePixelRatio || 1, 2);
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);
        canvas.setAttribute('role', 'img');
        canvas.dataset.pageNumber = number;
        canvas.setAttribute('aria-label', copy[lang()].page(number, pdf.numPages));
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        figure.style.aspectRatio = '';
        figure.replaceChildren(canvas);
      }

      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            observer.unobserve(entry.target);
            render(entry.target);
          }
        });
      }, { rootMargin: '1200px 0px' });

      for (let number = 1; number <= pdf.numPages; number += 1) {
        const figure = document.createElement('figure');
        figure.className = 'page';
        figure.dataset.page = number;
        figure.style.aspectRatio = `${base.width} / ${base.height}`;
        pagesEl.append(figure);
        observer.observe(figure);
      }
    }).catch(() => {
      statusEl.innerHTML = copy[lang()].error;
    });
  </script>
</body>
</html>
