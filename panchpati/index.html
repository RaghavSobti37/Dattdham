<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#a71922">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <title>श्री दत्त पंचपदी | Shri Kshetra Dattadham</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@500&family=Source+Sans+3:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,500&display=swap');
    :root{--maroon:#a71922;--ink:#282015;--stone:#675445;--sand:#fff7e5;--linen:#f1e3c2;--line:#e7c878;--white:#fffdf5;--page-shadow:#28201526;--serif:"Source Serif 4","Noto Serif Devanagari",serif;--sans:"Source Sans 3","Noto Serif Devanagari",sans-serif}
    *{box-sizing:border-box}
    html,body{overflow-x:clip}
    body{margin:0;background:var(--linen);color:var(--ink);font:400 16px/1.5 var(--sans)}
    .bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:10px max(16px,calc((100% - 1000px)/2));background:var(--white);border-bottom:1px solid var(--line)}
    .bar img{width:44px;height:44px;border-radius:50%;flex:0 0 auto}
    .bar h1{margin:0;min-width:0;color:var(--maroon);font:500 20px/1.15 var(--serif);overflow-wrap:break-word}
    .bar small{display:block;color:var(--stone);font:400 13px/1.3 var(--sans)}
    .count{margin-left:auto;color:var(--stone);font:600 14px var(--sans);white-space:nowrap}
    .pages{display:grid;gap:18px;width:min(1000px,100%);margin:0 auto;padding:18px 16px 48px}
    .page{position:relative;margin:0;background:var(--white);box-shadow:0 2px 14px var(--page-shadow)}
    .page canvas{display:block;width:100%;height:auto}
    .status{padding:48px 16px;text-align:center;color:var(--stone)}
    .status a{color:var(--maroon)}
    a:focus-visible{outline:3px solid var(--maroon);outline-offset:3px}
  </style>
</head>
<body>
  <header class="bar">
    <img src="/assets/dattadham-seal.jpg" alt="">
    <h1><span lang="hi">श्री दत्त पंचपदी</span><small>Shri Kshetra Dattadham</small></h1>
    <p class="count" aria-live="polite" data-count></p>
  </header>
  <main class="pages" data-pages aria-label="Document pages">
    <p class="status" data-status>Loading the document… <noscript>This viewer needs JavaScript. <a href="/panchpati/panchpati.pdf">Open the document</a>.</noscript></p>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    const PDF_URL = '/panchpati/panchpati.pdf';
    const pagesEl = document.querySelector('[data-pages]');
    const statusEl = document.querySelector('[data-status]');
    const countEl = document.querySelector('[data-count]');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    pdfjsLib.getDocument(PDF_URL).promise.then(async (pdf) => {
      statusEl.remove();
      countEl.textContent = `${pdf.numPages} pages`;
      const first = await pdf.getPage(1);
      const base = first.getViewport({ scale: 1 });
      const rendered = new Set();

      async function render(figure) {
        const number = Number(figure.dataset.page);
        if (rendered.has(number)) return;
        rendered.add(number);
        const page = await pdf.getPage(number);
        const cssWidth = figure.clientWidth;
        const unscaled = page.getViewport({ scale: 1 });
        const scale = (cssWidth / unscaled.width) * Math.min(window.devicePixelRatio || 1, 2);
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);
        canvas.setAttribute('role', 'img');
        canvas.setAttribute('aria-label', `Page ${number} of ${pdf.numPages}`);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        figure.style.aspectRatio = '';
        figure.replaceChildren(canvas);
      }

      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            observer.unobserve(entry.target);
            render(entry.target);
          }
        });
      }, { rootMargin: '1200px 0px' });

      for (let number = 1; number <= pdf.numPages; number += 1) {
        const figure = document.createElement('figure');
        figure.className = 'page';
        figure.dataset.page = number;
        figure.style.aspectRatio = `${base.width} / ${base.height}`;
        pagesEl.append(figure);
        observer.observe(figure);
      }
    }).catch(() => {
      statusEl.innerHTML = 'The document could not be shown here. <a href="/panchpati/panchpati.pdf">Open the document</a>.';
    });
  </script>
</body>
</html>
